name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHPUnit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Must stay in sync with composer.json's "php": "^8.2" constraint.
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, gd, intl, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml pins the suite to sqlite :memory:, so no database service
      # is needed here.
      - name: Run tests
        run: php artisan test
